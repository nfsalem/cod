<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Service Desk Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root { --brand: #078c80; --brand-light: #e6f4f2; }
    body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
    .bg-brand { background-color: var(--brand); }
    .text-brand { color: var(--brand); }
    .history-box { max-height: 150px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 11.5px; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 250px; padding: 15px 20px; border-radius: 8px; color: white; font-weight: bold; transform: translateX(120%); transition: transform 0.3s; display: flex; align-items: center; gap: 10px;}
    .toast.show { transform: translateX(0); }
    .toast.success { background-color: #10b981; } .toast.error { background-color: #ef4444; } .toast.info { background-color: var(--brand); }
    .search-result { position: absolute; width: 100%; background: white; border: 1px solid #ccc; z-index: 10; max-height: 150px; overflow-y: auto; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .search-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; }
    .search-item:hover { background: #f0fdfa; }
  </style>

  <script>
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkt7AI8M6oHdwA1nqNX3wcTWPpGFfZexFx8cB-6bhigDV8yk2f56e6eXRYGSn0CfJk/exec"; 
    // ==========================================

    let currentUser = {};
    let globalMasterData = { targetDepts: [], userDepts: [], categories: {}, subCategories: {}, statuses: {} };
    let userTicketsCache = [];
    let adminTicketsCache = [];
    let adminStaffList = [];

    async function callAPI(action, data) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST', body: JSON.stringify({ action: action, data: data }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        return await res.json();
      } catch(e) { showToast("Connection Error!", "error"); return {status: "Error"}; }
    }

    window.onload = async function() {
      const savedSession = localStorage.getItem('neuroDeskSession');
      showToast("Connecting to Database...", "info");
      const res = await callAPI('getMasterData', {});
      if(res.status === "Success") {
        globalMasterData = res.data;
        populateMasterDropdowns();
      }
      if(savedSession) { currentUser = JSON.parse(savedSession); postLoginSetup(); } 
      else { showPage('loginPage'); }
    };

    function populateMasterDropdowns() {
      let deptHTML = `<option value="">Select Target Department...</option>`;
      globalMasterData.targetDepts.forEach(d => deptHTML += `<option value="${d}">${d}</option>`);
      document.getElementById('targetDept').innerHTML = deptHTML;
      document.getElementById('obTargetDept').innerHTML = deptHTML;

      let userDeptHTML = `<option value="">Select Your Department...</option>`;
      globalMasterData.userDepts.forEach(d => userDeptHTML += `<option value="${d}">${d}</option>`);
      document.getElementById('regDept').innerHTML = userDeptHTML;
    }

    function updateCategoryDropdown(targetDeptId, catId) {
      const dept = document.getElementById(targetDeptId).value;
      const catDrop = document.getElementById(catId);
      catDrop.innerHTML = '<option value="">Select Category...</option>';
      if(globalMasterData.categories[dept]) {
        globalMasterData.categories[dept].forEach(c => catDrop.innerHTML += `<option value="${c}">${c}</option>`);
      }
    }

    function updateSubCategoryDropdown(catId, subCatId) {
      const cat = document.getElementById(catId).value;
      const subDrop = document.getElementById(subCatId);
      subDrop.innerHTML = '<option value="">Select Details...</option>';
      if(globalMasterData.subCategories[cat]) {
        globalMasterData.subCategories[cat].forEach(s => subDrop.innerHTML += `<option value="${s}">${s}</option>`);
      }
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`; toast.innerHTML = `<span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 100);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function showPage(pageId) {
      document.querySelectorAll('.page-view').forEach(el => el.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden'); window.scrollTo(0,0);
    }

    // --- AUTHENTICATION ---
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn'); btn.innerText = "Processing..."; btn.disabled = true;
      const data = { empId: e.target.empId.value, name: e.target.name.value, mobile: e.target.mobile.value, dept: e.target.dept.value, email: e.target.email.value, username: e.target.username.value, password: e.target.password.value };
      const res = await callAPI('registerUser', data);
      btn.innerText = "Register Account"; btn.disabled = false;
      if(res.status === "Success") { showToast(res.msg, 'success'); e.target.reset(); showPage('loginPage'); } 
      else { showToast(res.msg, 'error'); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn'); btn.innerText = "Authenticating..."; btn.disabled = true;
      const res = await callAPI('loginUser', {username: e.target.username.value, password: e.target.password.value});
      btn.innerText = "Login securely"; btn.disabled = false;
      if(res.status === "Success") {
        currentUser = res; localStorage.setItem('neuroDeskSession', JSON.stringify(currentUser)); postLoginSetup();
      } else { showToast(res.msg, 'error'); }
    }

    function postLoginSetup() {
      document.getElementById('welcomeName').innerText = "Hi, " + currentUser.name.split(' ')[0];
      document.getElementById('navBar').classList.remove('hidden'); showToast("Welcome!", "success");
      if(currentUser.role === "Admin") { showPage('adminDashboard'); initAdminWorkspace(); } 
      else { showPage('userDashboard'); loadMyTickets(); }
    }

    function logout() { localStorage.removeItem('neuroDeskSession'); document.getElementById('navBar').classList.add('hidden'); showPage('loginPage'); }

    // --- USER FUNCTIONS ---
    async function submitTicket(e) {
      e.preventDefault();
      const btn = document.getElementById('ticketBtn'); btn.innerText = "Processing..."; btn.disabled = true;
      const data = { creatorRole: "User", entryName: e.target.entryName.value, email: currentUser.email, userDept: currentUser.dept, mobile: currentUser.mobile, targetDept: e.target.targetDept.value, category: e.target.category.value, subCategory: e.target.subCategory.value, desc: e.target.desc.value };
      const res = await callAPI('createTicket', data);
      btn.innerText = "Submit Request"; btn.disabled = false;
      if(res.status === "Success") { showToast(`Ticket Created!`, 'success'); e.target.reset(); showPage('userDashboard'); loadMyTickets(); }
    }

    async function loadMyTickets() {
      document.getElementById('userTicketTable').innerHTML = '<p class="text-center py-10 text-gray-500">Fetching records...</p>';
      const res = await callAPI('getMyTickets', {email: currentUser.email});
      userTicketsCache = res.data; filterUserTickets();
    }

    function filterUserTickets() {
      const statusFilter = document.getElementById('userFilterStatus').value;
      const filtered = userTicketsCache.filter(t => statusFilter === 'All' || t.status === statusFilter);
      let html = '';
      if(filtered.length === 0) { document.getElementById('userTicketTable').innerHTML = `<p class="text-center py-10">No complaints found.</p>`; return; }
      
      filtered.reverse().forEach(t => {
        let isClosed = t.status === 'Closed' || t.status === 'Resolved';
        let feedbackAction = (t.status === 'Resolved' && !t.feedback) ? `<button onclick="openFeedback('${t.targetDept}', ${t.row}, '${t.id}')" class="mt-2 w-full bg-brand text-white py-2 rounded text-sm font-bold shadow">Provide Feedback to Close</button>` : (t.feedback ? `<div class="text-xs text-green-600 mt-2 font-bold text-center">Closed - Rated ${t.feedback} Stars</div>` : '');
        html += `
        <div class="bg-white p-4 rounded-xl shadow border mb-4">
          <div class="flex justify-between border-b pb-2 mb-2"><div><span class="font-bold text-lg">${t.id}</span> <p class="text-xs text-gray-500">To: ${t.targetDept}</p></div><span class="px-2 py-1 text-xs font-bold rounded bg-gray-100">${t.status}</span></div>
          <p class="text-sm font-bold">${t.category} > ${t.subCategory}</p>
          <div class="history-box bg-gray-50 p-2 mt-2 border rounded">${t.remarksHistory}</div>
          ${!isClosed ? `<div class="mt-2 flex gap-2"><input type="text" id="uc_${t.targetDept}_${t.row}" class="w-full text-xs p-2 border rounded" placeholder="Reply..."><button onclick="sendUserChat('${t.targetDept}', ${t.row}, '${t.id}')" class="bg-blue-600 text-white px-3 rounded"><i class="fas fa-paper-plane"></i></button></div>` : ''}
          ${feedbackAction}
        </div>`;
      });
      document.getElementById('userTicketTable').innerHTML = html;
    }

    // FEEDBACK SYSTEM
    let fbDept = "", fbRow = 0, fbId = "";
    function openFeedback(dept, row, id) { fbDept = dept; fbRow = row; fbId = id; document.getElementById('feedbackModal').classList.remove('hidden'); }
    async function submitFeedback() {
      const rating = document.getElementById('starRating').value;
      const comments = document.getElementById('feedbackRemarks').value;
      if(!rating) return showToast("Select rating!", "error");
      document.getElementById('feedbackBtn').innerText = "Submitting...";
      await callAPI('submitTicketFeedback', {targetDept: fbDept, row: fbRow, ticketId: fbId, rating: rating, comments: comments});
      document.getElementById('feedbackModal').classList.add('hidden');
      document.getElementById('feedbackBtn').innerText = "Submit & Close"; showToast("Ticket Closed!", "success"); loadMyTickets();
    }

    // --- ADMIN WORKSPACE ---
    async function initAdminWorkspace() {
      document.getElementById('adminTitle').innerText = currentUser.dept + " Admin Workspace";
      document.getElementById('adminTicketTable').innerHTML = '<p class="text-center py-10">Loading Data...</p>';
      const res = await callAPI('getAllTickets', {dept: currentUser.dept, role: currentUser.role});
      adminTicketsCache = res.data.reverse(); adminStaffList = res.staff;
      document.getElementById('statTotal').innerText = res.stats.total; document.getElementById('statOpen').innerText = res.stats.open; document.getElementById('statResolved').innerText = res.stats.resolved;
      filterAdminTickets();
    }

    function filterAdminTickets() {
      const searchTxt = document.getElementById('adminSearch').value.toLowerCase();
      const statusFilter = document.getElementById('adminFilterStatus').value;
      const filtered = adminTicketsCache.filter(t => {
        const matchSearch = t.id.toLowerCase().includes(searchTxt) || t.name.toLowerCase().includes(searchTxt) || (t.mobile && t.mobile.toString().includes(searchTxt));
        const matchStatus = statusFilter === 'All' ? true : (statusFilter === 'MyTickets' ? t.assignedTo === currentUser.name : t.status === statusFilter);
        return matchSearch && matchStatus;
      });
      
      let html = '';
      filtered.forEach(t => {
        let isClosed = t.status === 'Closed' || t.status === 'Resolved';
        let techOptions = `<option value="Unassigned">Unassigned</option>`;
        adminStaffList.forEach(tech => techOptions += `<option value="${tech}" ${t.assignedTo===tech?'selected':''}>${tech}</option>`);
        
        let dynamicStatuses = `<option value="Assigned" ${t.status=='Assigned'?'selected':''}>Claim / Assigned</option>`;
        if(globalMasterData.statuses[currentUser.dept]) {
          globalMasterData.statuses[currentUser.dept].forEach(s => dynamicStatuses += `<option value="${s}" ${t.status==s?'selected':''}>${s}</option>`);
        } else {
           dynamicStatuses += `<option value="In-Progress" ${t.status=='In-Progress'?'selected':''}>In-Progress</option><option value="Resolved">Resolved</option>`;
        }

        html += `
        <div class="bg-white p-5 rounded-xl shadow border mb-4">
          <div class="flex justify-between border-b pb-2 mb-2"><span class="font-bold text-lg">${t.id} <span class="text-xs bg-gray-100 px-2 ml-2 rounded">${t.assignedTo}</span></span><span class="text-xs font-bold">${t.status}</span></div>
          <p class="text-sm"><b>${t.name}</b> (${t.dept}) - ${t.mobile}</p>
          <p class="text-sm font-bold text-gray-800 mt-1">${t.category} > ${t.subCategory}</p>
          <p class="text-xs bg-yellow-50 p-2 border mt-1 italic">${t.desc}</p>
          <div class="history-box bg-gray-50 border p-2 rounded mt-2">${t.remarksHistory}</div>
          
          ${!isClosed ? `
          <div class="bg-gray-50 p-3 rounded border mt-2 flex flex-col md:flex-row gap-2">
            <select id="at_${t.row}" class="text-sm p-2 border rounded w-full md:w-1/4">${techOptions}</select>
            <select id="as_${t.row}" class="text-sm p-2 border rounded w-full md:w-1/4">${dynamicStatuses}</select>
            <input type="text" id="ar_${t.row}" class="w-full text-sm p-2 border rounded" placeholder="Status update remark...">
            <button onclick="adminUpdate(${t.row}, '${t.email}', '${t.id}')" class="bg-brand text-white px-4 rounded font-bold">Save</button>
          </div>` : `<div class="bg-green-50 p-2 mt-2 text-green-700 font-bold text-xs text-center rounded">Ticket Closed (${t.feedbackRating || 'N/A'} Stars)</div>`}
        </div>`;
      });
      document.getElementById('adminTicketTable').innerHTML = html;
    }

    async function adminUpdate(row, email, id) {
      const status = document.getElementById(`as_${row}`).value;
      const remark = document.getElementById(`ar_${row}`).value;
      const tech = document.getElementById(`at_${row}`).value;
      if(!remark) return showToast("Remark empty!", "error");
      showToast("Updating...", "info");
      await callAPI('updateTicketStatus', {targetDept: currentUser.dept, row: row, ticketId: id, adminName: currentUser.name, status: status, newRemark: remark, assignedTech: tech, userEmail: email});
      showToast("Updated!", "success"); initAdminWorkspace();
    }

    // --- SMART PROXY TICKET ---
    let searchTimeout;
    async function handleGhostSearch(val) {
      const resDiv = document.getElementById('ghostSearchResults');
      if(val.length < 2) { resDiv.innerHTML = ''; return; }
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        const res = await callAPI('searchUserGhost', {query: val});
        if(res.users && res.users.length > 0) {
          let h = ''; res.users.forEach(u => h += `<div class="search-item" onclick="fillGhostData('${u.empId}','${u.name}','${u.mobile}','${u.email}','${u.dept}')"><b>${u.name}</b> (${u.empId})</div>`);
          resDiv.innerHTML = h;
        } else { resDiv.innerHTML = '<div class="p-2 text-xs text-gray-500">No Match - Enter manually to create new</div>'; }
      }, 500);
    }
    function fillGhostData(id, n, m, e, d) {
      document.getElementById('obEmpId').value = id; document.getElementById('obName').value = n;
      document.getElementById('obMobile').value = m; document.getElementById('obEmail').value = e; document.getElementById('obUserDept').value = d;
      document.getElementById('ghostSearchResults').innerHTML = '';
    }
    async function submitOnBehalfTicket(e) {
      e.preventDefault();
      const btn = document.getElementById('onBehalfBtn'); btn.innerText = "Processing..."; btn.disabled = true;
      const data = { creatorRole: "Admin", empId: e.target.obEmpId.value, entryName: e.target.obName.value, mobile: e.target.obMobile.value, email: e.target.obEmail.value, userDept: e.target.obUserDept.value, targetDept: e.target.obTargetDept.value, category: e.target.obCategory.value, subCategory: e.target.obSubCategory.value, desc: e.target.obDesc.value };
      const res = await callAPI('createTicket', data);
      btn.innerText = "Create Proxy Ticket"; btn.disabled = false;
      if(res.status === "Success") { showToast("Proxy Ticket Created!", "success"); e.target.reset(); document.getElementById('adminRaiseTicketModal').classList.add('hidden'); initAdminWorkspace(); }
    }
  </script>
</head>
<body class="app-container">
  
  <div id="toast-container"></div>
  <nav id="navBar" class="bg-brand text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-40 hidden">
    <div class="flex items-center gap-3"><div class="bg-white text-brand w-9 h-9 rounded-full flex items-center justify-center font-bold text-xl"><i class="fas fa-hospital-symbol"></i></div><div><h1 class="text-sm md:text-lg font-bold">NF Helpdesk</h1></div></div>
    <div class="flex items-center gap-4"><span id="welcomeName" class="text-sm font-bold bg-[#056b62] px-3 py-1 rounded-full hidden md:inline"></span><button onclick="logout()" class="text-white bg-red-600 px-3 py-1.5 text-sm rounded shadow"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
  </nav>

  <div class="content-area p-4 md:p-6 max-w-6xl mx-auto w-full">

    <div id="loginPage" class="page-view w-full max-w-md mx-auto mt-10 px-4">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-brand">
        <h2 class="text-2xl font-bold text-center mb-6">Service Portal Login</h2>
        <form onsubmit="handleLogin(event)">
          <input type="text" name="username" placeholder="Username" required class="w-full p-3 mb-4 border rounded bg-gray-50 focus:ring-2 focus:ring-[#078c80] outline-none">
          <input type="password" name="password" placeholder="Password" required class="w-full p-3 mb-6 border rounded bg-gray-50 focus:ring-2 focus:ring-[#078c80] outline-none">
          <button id="loginBtn" type="submit" class="w-full bg-brand text-white font-bold p-3 rounded shadow">Login</button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">New User? <button onclick="showPage('regPage')" class="text-brand font-bold">Register</button></p>
      </div>
    </div>

    <div id="regPage" class="page-view hidden w-full max-w-md mx-auto mt-6 px-4">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-brand">
        <h2 class="text-2xl font-bold text-center mb-6">Register Account</h2>
        <form onsubmit="handleRegister(event)" class="grid gap-4">
          <input type="text" name="empId" placeholder="Employee ID" required class="p-3 border rounded bg-gray-50">
          <input type="text" name="name" placeholder="Full Name" required class="p-3 border rounded bg-gray-50">
          <input type="number" name="mobile" placeholder="Mobile Number" required class="p-3 border rounded bg-gray-50">
          <select id="regDept" name="dept" required class="p-3 border rounded bg-gray-50"><option value="">Select Department...</option></select>
          <input type="email" name="email" placeholder="Email Address" required class="p-3 border rounded bg-gray-50">
          <input type="text" name="username" placeholder="Create Username" required class="p-3 border rounded bg-gray-50">
          <input type="password" name="password" placeholder="Create Password" required class="p-3 border rounded bg-gray-50">
          <button id="regBtn" type="submit" class="w-full bg-brand text-white font-bold p-3 rounded">Register</button>
          <button type="button" onclick="showPage('loginPage')" class="text-sm text-gray-500 font-bold mt-2">Back to Login</button>
        </form>
      </div>
    </div>

    <!-- USER DASHBOARD -->
    <div id="userDashboard" class="page-view hidden max-w-3xl mx-auto mt-4">
      <div class="bg-brand rounded-xl p-6 text-white shadow mb-6">
        <h2 class="text-2xl font-bold mb-2">Need Facility Support?</h2>
        <button onclick="document.getElementById('ticketEntryName').value = currentUser.name; showPage('raiseTicketPage');" class="bg-white text-brand font-bold px-6 py-2 rounded shadow mt-2">Raise Request / Consumables</button>
      </div>
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-lg">My History</h3>
        <div class="flex gap-2 items-center">
          <select id="userFilterStatus" onchange="filterUserTickets()" class="p-1 border rounded text-sm bg-white"><option value="All">All Tickets</option><option value="Open">Open</option><option value="In-Progress">In-Progress</option><option value="Resolved">Resolved</option><option value="Closed">Closed</option></select>
          <button onclick="loadMyTickets()" class="text-brand text-sm"><i class="fas fa-sync"></i></button>
        </div>
      </div>
      <div id="userTicketTable"></div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="page-view hidden mt-2">
      <div class="flex justify-between items-center mb-4 bg-white p-4 rounded shadow border">
         <h2 id="adminTitle" class="text-lg font-bold text-gray-800">Admin Workspace</h2>
         <button onclick="document.getElementById('adminRaiseTicketModal').classList.remove('hidden')" class="bg-brand text-white px-4 py-2 rounded shadow font-bold text-sm">Proxy Ticket</button>
      </div>
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white p-4 rounded shadow border-l-4 border-brand"><p class="text-xs text-gray-500 font-bold">Total</p><h3 id="statTotal" class="text-xl font-bold">0</h3></div>
        <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500"><p class="text-xs text-gray-500 font-bold">Open</p><h3 id="statOpen" class="text-xl font-bold">0</h3></div>
        <div class="bg-white p-4 rounded shadow border-l-4 border-green-500"><p class="text-xs text-gray-500 font-bold">Resolved</p><h3 id="statResolved" class="text-xl font-bold">0</h3></div>
      </div>
      
      <div class="bg-white p-4 rounded shadow border mb-4 flex flex-col md:flex-row gap-3">
         <input type="text" id="adminSearch" onkeyup="filterAdminTickets()" placeholder="Search ID, Name, Mobile..." class="w-full p-2 border rounded bg-gray-50">
         <select id="adminFilterStatus" onchange="filterAdminTickets()" class="p-2 border rounded bg-gray-50 md:w-1/3">
           <option value="All">All Statuses</option><option value="MyTickets" class="font-bold text-brand">Assigned To Me</option><option value="Open">Open</option><option value="In-Progress">In-Progress</option><option value="Resolved">Resolved</option><option value="Closed">Closed</option>
         </select>
         <button onclick="initAdminWorkspace()" class="bg-gray-200 px-4 rounded font-bold"><i class="fas fa-sync"></i></button>
      </div>
      <div id="adminTicketTable"></div>
    </div>

    <!-- RAISE TICKET MODAL -->
    <div id="raiseTicketPage" class="page-view hidden max-w-lg mx-auto mt-4">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-brand">
        <h2 class="text-xl font-bold mb-6">New Service Request</h2>
        <form onsubmit="submitTicket(event)" class="grid gap-4">
          <input type="text" id="ticketEntryName" name="entryName" readonly class="p-3 border rounded bg-gray-100">
          <select id="targetDept" name="targetDept" onchange="updateCategoryDropdown('targetDept', 'primaryCategory')" required class="p-3 border rounded bg-gray-50"><option value="">Select Target Department...</option></select>
          <select id="primaryCategory" name="category" onchange="updateSubCategoryDropdown('primaryCategory', 'subCategory')" required class="p-3 border rounded bg-gray-50"><option value="">Select Category First...</option></select>
          <select id="subCategory" name="subCategory" required class="p-3 border rounded bg-gray-50"><option value="">Select Details First...</option></select>
          <textarea name="desc" rows="3" placeholder="Description / Quantity for Consumables..." required class="p-3 border rounded bg-gray-50"></textarea>
          <div class="flex gap-2 mt-2">
            <button type="button" onclick="showPage('userDashboard')" class="w-1/3 bg-gray-200 text-gray-700 font-bold p-3 rounded">Cancel</button>
            <button id="ticketBtn" type="submit" class="w-2/3 bg-brand text-white font-bold p-3 rounded shadow">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ADMIN PROXY TICKET MODAL -->
    <div id="adminRaiseTicketModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
      <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-lg relative">
        <button type="button" onclick="document.getElementById('adminRaiseTicketModal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 text-xl">&times;</button>
        <h3 class="text-xl font-bold mb-4 border-b pb-2">Proxy Ticket Creation</h3>
        <form onsubmit="submitOnBehalfTicket(event)" class="grid gap-3">
          <div class="relative">
             <input type="text" id="obName" name="obName" placeholder="User Name (Type to Search...)" onkeyup="handleGhostSearch(this.value)" autocomplete="off" required class="w-full p-2 border rounded bg-gray-50 text-sm">
             <div id="ghostSearchResults" class="search-result"></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
             <input type="text" id="obEmpId" name="obEmpId" placeholder="Emp ID" required class="p-2 border rounded bg-gray-50 text-sm">
             <input type="text" id="obUserDept" name="obUserDept" placeholder="User's Dept" required class="p-2 border rounded bg-gray-50 text-sm">
             <input type="number" id="obMobile" name="obMobile" placeholder="Mobile" required class="p-2 border rounded bg-gray-50 text-sm">
             <input type="email" id="obEmail" name="obEmail" placeholder="Email" required class="p-2 border rounded bg-gray-50 text-sm">
          </div>
          <div class="border-t my-2 pt-2">
            <select id="obTargetDept" name="obTargetDept" onchange="updateCategoryDropdown('obTargetDept', 'obPrimaryCategory')" required class="w-full p-2 mb-3 border rounded bg-gray-50 text-sm"><option value="">Select Target Dept...</option></select>
            <div class="grid grid-cols-2 gap-3 mb-3">
              <select id="obPrimaryCategory" name="obCategory" onchange="updateSubCategoryDropdown('obPrimaryCategory', 'obSubCategory')" required class="p-2 border rounded bg-gray-50 text-sm"><option value="">Select Category...</option></select>
              <select id="obSubCategory" name="obSubCategory" required class="p-2 border rounded bg-gray-50 text-sm"><option value="">Details...</option></select>
            </div>
            <textarea name="obDesc" rows="2" placeholder="Issue Description" required class="w-full p-2 border rounded bg-gray-50 text-sm"></textarea>
          </div>
          <button id="onBehalfBtn" type="submit" class="w-full bg-brand text-white font-bold py-3 mt-1 rounded shadow">Create Ticket</button>
        </form>
      </div>
    </div>

    <!-- FEEDBACK MODAL -->
    <div id="feedbackModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
      <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
        <h3 class="text-2xl font-bold mb-2">Issue Resolved!</h3>
        <p class="text-sm text-gray-500 mb-6">Rate our service to close this ticket.</p>
        <select id="starRating" class="w-full p-3 border-2 rounded bg-gray-50 font-bold mb-4 outline-none">
          <option value="">- Select Stars -</option><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
        </select>
        <textarea id="feedbackRemarks" rows="2" placeholder="Comments..." class="w-full p-3 border rounded bg-gray-50 mb-4 outline-none"></textarea>
        <div class="flex gap-2">
          <button onclick="document.getElementById('feedbackModal').classList.add('hidden')" class="w-1/3 bg-gray-200 font-bold p-3 rounded">Later</button>
          <button id="feedbackBtn" onclick="submitFeedback()" class="w-2/3 bg-brand text-white font-bold p-3 rounded shadow">Submit & Close</button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
